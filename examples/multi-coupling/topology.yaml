participants:
  - name: Fluid-Top
    solver: OpenFOAM
    dimensionality: 2
  - name: Fluid-Bottom
    solver: OpenFOAM
    dimensionality: 2
  - name: Solid
    solver: CalculiX
    dimensionality: 2

exchanges:
  - from: Fluid-Top
    from-location-name: surface
    to: Solid
    to-location-name: interface
    data: Temperature-Top  # Solid reads temperature
    type: strong
  - from: Solid
    from-location-name: surface
    to: Fluid-Top
    to-location-name: interface
    data: HeatTransfer-Top  # Solid reads temperature
    type: strong
  - from: Fluid-Bottom
    from-location-name: surface
    to: Solid
    to-location-name: interface
    data: Temperature-Bottom  # Solid reads temperature
    type: strong
  - from: Solid
    from-location-name: interface
    to: Fluid-Bottom
    to-location-name: surface
    data: HeatTransfer-Bottom # Fluid reads heat flux
    type: strong

    to: Fluid1
    data: Pressure
    type: strong
    from-location-names: [interface]
    to-location-names: [interface]
  - from: Fluid1
    to: Fluid2
    data: Alpha
    data-type: scalar
    type: strong
    from-location-names: [interface]
    to-location-names: [interface]

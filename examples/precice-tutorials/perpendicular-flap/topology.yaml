participants:
  - name: Fluid
    solver: FluidSolver
    dimensionality: 2
  - name: Solid
    solver: SolidSolver
    dimensionality: 2
exchanges:
  - from: Fluid
    to: Solid
    data: Force
    type: strong
    from-location-names: [interface]
    to-location-names: [interface]
  - from: Solid
    to: Fluid
    data: Displacement
    type: strong
    from-location-names: [interface]
    to-location-names: [interface]
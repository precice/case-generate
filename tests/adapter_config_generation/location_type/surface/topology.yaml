participants:
  - name: Fluid
    solver: OpenFOAM
  - name: Solid
    solver: CalculiX

exchanges:
  - from: Fluid
    to: Solid
    from-location-names: [wet-surface]
    to-location-names: [wet-surface]
    from-location-type: surface
    to-location-type: surface
    type: strong
    data: Forces
    data-type: vector
  - from: Solid
    to: Fluid
    from-location-names: [wet-surface]
    to-location-names: [wet-surface]
    from-location-type: surface
    to-location-type: surface
    type: strong
    data: Displacements
    data-type: vector
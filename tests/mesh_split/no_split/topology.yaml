participants:
  - name: Fluid
    solver: OpenFOAM
  - name: Solid
    solver: CalculiX

exchanges:
  - from: Fluid
    to: Solid
    from-location-names: [wet-surface]
    to-location-names: [wet-surface]
    type: strong
    data: Forces # Extensive
    from-location-type: surface
    to-location-type: surface
  - from: Solid
    to: Fluid
    from-location-names: [wet-surface]
    to-location-names: [wet-surface]
    type: strong
    data: Displacements # Intensive
    from-location-type: surface
    to-location-type: surface
